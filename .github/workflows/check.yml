# Every pull request: the orbs it touches must pass `npx aurb check`, the same command contributors run locally.
name: Check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check changed orbs
        run: |
          dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- orbs | cut -d/ -f1-2 | sort -u | while read d; do [ -d "$d" ] && echo "$d"; done)
          if [ -z "$dirs" ]; then echo "No orbs changed."; exit 0; fi
          npx -y github:chalktalkhq/aurb check $dirs
