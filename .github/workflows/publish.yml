# Every merge to main: publish the list as @aurb/index, which the site and npx aurb read, built here from orbs.json.
# No token: npm trusts this workflow through Trusted Publishing, set on @aurb/index only (npmjs.com, Settings,
# Trusted Publisher: GitHub Actions, chalktalkhq/aurb-orbs, publish.yml), so it can publish the list and nothing else.
name: Publish
on:
  push:
    branches: [main]
    paths: ["orbs.json", "scripts/index.mjs"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # Trusted Publishing and provenance: npm checks this run's identity, and the index links back to it
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@11 # Trusted Publishing needs 11.5.1 or later
      - run: node scripts/index.mjs
