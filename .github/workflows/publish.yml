# Every merge to main: publish the list as @aurb/index, which the site and npx @aurb/player read, built here from orbs.json.
# npm auth is the NPM_TOKEN secret, an npm granular access token that can publish @aurb/index. To move to trusted
# publishing (no stored token), set this workflow as @aurb/index's trusted publisher on npmjs.com (GitHub Actions,
# chalktalkhq/aurb-orbs, publish.yml), then delete the secret: npm uses this run's identity when it can.
name: Publish
on:
  push:
    branches: [main]
    paths: ["orbs.json", "scripts/index.mjs"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # Trusted Publishing and provenance: npm checks this run's identity, and the index links back to it
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@11 # Trusted Publishing needs 11.5.1 or later
      - run: node scripts/index.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
