# Every merge to main: publish the list as @aurb/index, which the site and npx aurb read. The npm token only ever
# publishes that list, built here from orbs.json; it never touches anyone's orb. Needs an npm automation token for the
# @aurb org as the NPM_TOKEN secret.
name: Publish
on:
  push:
    branches: [main]
    paths: ["orbs.json", "scripts/index.mjs"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance: the index links back to the commit that built it
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: node scripts/index.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
